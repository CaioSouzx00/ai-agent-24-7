[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-24-7"
version = "0.1.0"
description = "24/7 AI agent powered by a local NVIDIA NIM LLM, with tools, memory and human handoff"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "langgraph>=0.2",
  "redis>=5.0",
  "asyncpg>=0.29",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "pyjwt>=2.8",
  "cryptography>=42.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
tools = ["playwright>=1.43", "google-api-python-client>=2.120", "google-auth-oauthlib>=1.2", "slack-sdk>=3.27", "PyGithub>=2.3"]
workflows = ["temporalio>=1.5"]
observability = ["sentry-sdk[fastapi]>=2.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "black>=24", "ruff>=0.4", "isort>=5.13", "pre-commit>=3.7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
