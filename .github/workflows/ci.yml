name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Basic Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Basic Syntax Check
        run: |
          python -m py_compile $(git ls-files '*.py')
          echo "All Python files compiled successfully without syntax errors"
