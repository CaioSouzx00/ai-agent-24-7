services:
  nim:
    image: nvcr.io/nim/meta/llama-3.1-8b-instruct:latest
    environment:
      NGC_API_KEY: ${NGC_API_KEY}
    ports: ["8000:8000"]
    shm_size: 16gb
    volumes:
      - nim-cache:/opt/nim/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: ["gpu"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.24
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: agent
      POSTGRES_PWD: agent
      POSTGRES_SEEDS: postgres
    depends_on: [postgres]
    ports: ["7233:7233"]
    profiles: ["workflows"]

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    env_file: ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://agent:agent@postgres:5432/agent
      NIM_BASE_URL: http://nim:8000/v1
    ports: ["8080:8080"]
    depends_on: [redis, postgres]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [app]
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:10.4.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
    profiles: ["monitoring"]

volumes:
  nim-cache:
  pg-data:

